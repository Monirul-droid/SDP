name: gobuddy
description: "ai based travel assistant app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.10.7 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  http: ^1.2.0  # Stable version for compatibility

  # ✅ Local Database
  sqflite: ^2.3.0
  path: ^1.9.0

  # ✅ Firebase
  firebase_core: ^2.25.4
  firebase_auth: ^4.17.4

  # ✅ UI & Icons
  cupertino_icons: ^1.0.8
  video_player: ^2.8.1
  visibility_detector: ^0.4.0+2
  intl: ^0.19.0
  provider: ^6.0.5
  image_picker: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # ✅ Logo change করার জন্য প্যাকেজ
  flutter_launcher_icons: "^0.13.1"

# ✅ লোগো কনফিগারেশন (আপনার gobuddylogo.png ব্যবহার করা হয়েছে)
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/gobuddylogo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/bg_video.mp4
    - assets/bg_video1.mp4
    - assets/budget_banner.webp
    - assets/CTA.jpg
    - assets/discover.png
    - assets/gobuddylogo.png
    - assets/header_bg.jpg
    - assets/kandy.jpg
    - assets/logo2.png
    - assets/place.jpg
    - assets/profile.jpg
    - assets/sigiriya.png
    - assets/solo_travel.png
    - assets/travel_2.jpg
    - assets/trip_banner.jpg